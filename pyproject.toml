[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gpt"
version = "0.12.0"
description = "Local-dev MCP sidecar for exposing selected Hermes Agent capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "hermes-gpt contributors" }
]
dependencies = [
  "mcp[cli]>=1.28.1,<3",
  "packaging>=23",
  "uvicorn",
  "cryptography>=42",
  "pyyaml",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "build",
  "twine",
  "pyyaml",
  "keyring",
]

[project.scripts]
hermes-gpt = "server:main"
hermes-gpt-fabric-peer = "operator_fabric_g4c:peer_main"

[tool.setuptools]
include-package-data = true
py-modules = [
