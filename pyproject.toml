[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-gpt"
version = "0.12.0"
description = "Local-dev MCP sidecar for exposing selected Hermes Agent capabilities."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
  { name = "hermes-gpt contributors" }
]
dependencies = [
  "mcp[cli]>=1.28.1,<3",
  "packaging>=23",
  "uvicorn",
  "cryptography>=42",
  "pyyaml",
  "tomli; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
  "pytest",
  "ruff",
  "build",
  "twine",
  "pyyaml",
  "keyring",
]

[project.scripts]
hermes-gpt = "hermes_gpt.server.app:main"
hermes-gpt-fabric-peer = "hermes_gpt.fleet.fabric_g4c:peer_main"

[tool.setuptools]
include-package-data = true
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["hermes_gpt*"]

[tool.setuptools.package-data]
"hermes_gpt.clients.chatgpt" = ["assets/*.html", "assets/*.css", "assets/*.js"]

[tool.setuptools.data-files]
"share/hermes-gpt" = [
  "README.md",
  "pyproject.toml",
  "CHANGELOG.md",
]
"share/hermes-gpt/docs" = [
  "docs/README.md",
  "docs/oauth.md",
  "docs/operator-mode.md",
  "docs/finance.md",
  "docs/missions.md",
  "docs/capabilities-and-mission-ledger.md",
  "docs/live-events.md",
  "docs/delegations.md",
  "docs/mcp-compatibility.md",
  "docs/file-export.md",
  "docs/openai-secure-mcp-tunnel.md",
  "docs/chatgpt-sessions-plugin.md",
  "docs/chatgpt-runtime-settings.md",
  "docs/cloudflare-tunnel.md",
  "docs/release-notes-v0.2.0.md",
  "docs/release-notes-v0.3.0.md",
  "docs/release-notes-v0.4.0.md",
  "docs/codex.md",
  "docs/session-history.md",
  "docs/session-control.md",
  "docs/managed-hermes-sessions.md",
  "docs/updating.md",
  "docs/runtime-checkout.md",
  "docs/release-notes-v0.5.0b1.md",
  "docs/release-notes-v0.5.0b2.md",
  "docs/release-notes-v0.5.0.md",
  "docs/release-notes-v0.6.0.md",
  "docs/release-notes-v0.7.0.md",
  "docs/release-notes-v0.8.0.md",
  "docs/retention-policy.md",
  "docs/windows-chatgpt-codex.md",
  "docs/ui-security-boundary.md",
  "docs/flight-deck-coverage.md",
  "docs/flight-deck-missions.md",
  "docs/gemini-spark.md",
]
"share/hermes-gpt/examples" = [
  "examples/start-hermes-gpt.example.ps1",
  "examples/start-openai-secure-mcp-tunnel.example.ps1",
  "examples/status-hermes-gpt.example.ps1",
  "examples/install-task.example.ps1",
  "examples/fleet-authority.example.json",
]
"share/hermes-gpt/docs/development" = [
  "docs/development/contributing.md",
  "docs/development/repository-layout.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = ["test_*.py"]
addopts = "-q"
